defaults:
  timeout: 10s
  health_path: /healthz
  retries: 0
  headers:
    X-Forwarded-By: sim-gateway

backends:
  - name: music
    url: http://music:8080
    timeout: 5s
    headers:
      X-Forwarded-Service: music

routes:
  - method: GET
    path: /albums
    backend: music
  - method: GET
    path: /album/:id
    backend: music
  - method: POST
    path: /album
    backend: music

server:
  addr: ":9000"
  log_level: "info"
  read_timeout: "10s"
  write_timeout: "10s"
  shutdown_timeout: "15s"
  request_timeout: "10s"

jwt:
  access_ttl: 15m
  refresh_ttl: 24h
